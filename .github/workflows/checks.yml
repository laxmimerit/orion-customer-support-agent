# Pull-request checks: the API tests that need no database, and the frontend tests and build.
# No secrets are used. The live tests (marker "live") are deselected, so nothing here reaches orion_desk.
name: checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: api
      - run: uv sync --locked
      - run: uv run --locked pytest -m "not live"

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
